<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FoodSpot · Coming soon</title>
<meta name="description" content="FoodSpot pins the restaurants you see in food reels on your map. Coming soon to Google Play." />
<meta name="theme-color" content="#0D0C0B" />
<meta name="robots" content="noindex" />
<link rel="icon" href="icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="site.css" />
<script>
  // Shared-spot links used to live at the site root (#<payload>); send them to /s/.
  function toSpot() { if (location.hash.length > 20) location.replace('s/' + location.hash); }
  toSpot();
  addEventListener('hashchange', toSpot);
</script>
<style>
  /* The full home page is kept in site/launch/ until FoodSpot is on Google Play. */
  main { min-height: calc(100vh - 80px); display: flex; flex-direction: column; }
  .soon { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 48px 0; }
  .soon h1 { font-size: 40px; }
  .soon p { max-width: 460px; font-size: 17px; }
  .pill { display: inline-block; align-self: flex-start; background: var(--accent-soft); color: var(--accent);
    font-weight: 700; font-size: 13px; letter-spacing: .4px; text-transform: uppercase; padding: 4px 12px;
    border-radius: 999px; margin-bottom: 16px; }
</style>
</head>
<body>
<main>
  <a class="brand" href="./"><img src="icon.png" alt="" /><span class="wordmark">Food<span>Spot</span></span></a>

  <section class="soon">
    <span class="pill">Coming soon</span>
    <h1>Every food reel, pinned on your map.</h1>
    <p>Share a reel from Instagram or YouTube and FoodSpot finds the restaurant and pins it on your map.
      We’re getting it ready for Google Play.</p>
    <p>Questions? Write to <a href="mailto:support@foodspot.app">support@foodspot.app</a>.</p>
  </section>

  <footer><a href="./">FoodSpot</a><a href="privacy">Privacy</a><a href="terms">Terms</a><a href="delete-data">Delete your data</a></footer>
</main>
</body>
</html>
